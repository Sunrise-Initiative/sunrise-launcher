[package]
name = "sunrise-launcher"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[dependencies]
dirs = "6"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wgpu", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-normalization = "0.1"

[dev-dependencies]
egui_kittest = "=0.36.2"
